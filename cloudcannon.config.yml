# CloudCannon Configuration for 11ty
# Fixed path configuration

source: src

collections_config:
  services:
    path: services
    name: "Services"
    icon: medical_services
    description: "Dental service pages"
    _enabled_editors:
      - content
      - data
    add_options:
      - name: "Service Page"
        icon: medical_services
        schema: default
  
  pages:
    path: pages
    name: "Pages"
    icon: wysiwyg  
    description: "General pages"
    _enabled_editors:
      - content
      - data
    add_options:
      - name: "Page"
        icon: wysiwyg
        schema: default

  blog:
    path: blog
    name: "Blog"
    icon: post_add
    description: "Blog posts"
    sort_key: date
    sort_order: desc
    _enabled_editors:
      - content
      - data
    add_options:
      - name: "Blog Post"
        icon: post_add
        schema: default

# Build settings
build:
  install_command: "npm install"
  build_command: "npm run build" 
  output_directory: "_site"

# Editor settings
_enabled_editors:
  - content
  - data

_editables:
  content:
    bold: true
    italics: true
    link: true

# Basic configuration
markdown:
  engine: commonmark

# Global configuration
base_url: /
timezone: Etc/UTC

source_editor:
  tab_size: 2
  show_gutter: false
  theme: pastel_on_dark

commit_templates:
  - template_string: '{message}'

# 11ty specific settings
generator:
  metadata:
    markdown: "markdown-it"
    
# Enable live editing
source_editor:
  enabled: true

# Data files for 11ty
data_config:
  navigation:
    path: "src/_data/navigation.yml"
  site:
    path: "src/_data/site.yml"
    
# Editor settings
_editors:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    code: true
    horizontalrule: true
    removeformat: true
    
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The title that appears in the browser tab and search results"
  description:
    type: textarea
    label: "Meta Description"
    comment: "Brief description for search engines (150-160 characters)"
  layout:
    type: select
    label: "Layout"
    options:
      values:
        - "layouts/base.njk"
        - "layouts/page.njk"
        - "layouts/service.njk"
        - "layouts/blog.njk"
  permalink:
    type: text
    label: "URL Path"
    comment: "The URL path for this page (e.g., /about/)"
  date:
    type: date
    label: "Date"
    comment: "Publication date"
  tags:
    type: array
    label: "Tags"
    comment: "Categories for organizing content"
        
# Asset paths
paths:
  uploads: "src/assets/images"
  
# Site settings
timezone: "America/New_York"

# CloudCannon 11ty integration
_11ty:
  enabled: true
  
# Collection schemas for better editing
_schema:
  default:
    path: "schemas/default.md"
  
# Metadata
_metadata:
  title: "Alexandria Dental Health"
  description: "Comprehensive dental care in Alexandria, VA"

# Define which files CloudCannon should ignore
ignore:
  - "node_modules"
  - ".git"
  - ".eleventy.js"
  - "package.json"
  - "package-lock.json" 