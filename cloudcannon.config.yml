# Simple CloudCannon Configuration
source: src

# Collections - Keep it simple
collections_config:
  services:
    path: services
    name: "Services" 
    icon: medical_services
  pages:
    path: pages
    name: "Pages"
    icon: article
  blog:
    path: blog
    name: "Blog"
    icon: edit

# Essential inputs only
_inputs:
  title:
    type: text
    label: "Page Title"
  subtitle:
    type: text
    label: "Subtitle"
  description:
    type: textarea
    label: "Description"

# Build settings
build:
  install_command: "npm install"
  build_command: "npm run build"
  output_dir: "_site"

# Generator
generator:
  metadata:
    eleventy: true 