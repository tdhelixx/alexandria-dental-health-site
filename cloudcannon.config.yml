# CloudCannon Configuration
source: src
collections_config:
  services:
    path: services
    name: "Services"
    description: "Dental service pages with enhanced visual editing"
    icon: medical_services
    _enabled_editors:
      - visual
      - content
      - data
    add_options:
      - name: "New Service Page"
        icon: add
        href: "cloudcannon:explore/services/"
    schemas:
      default:
        path: schemas/service.md
    _inputs:
      # === BASIC INFORMATION ===
      title:
        type: text
        label: "Service Title"
        comment: "The main title for this service page (e.g., 'Dental Implants in Alexandria VA')"
        cascade: true
      description:
        type: textarea
        label: "Meta Description"
        comment: "SEO description for search engines (keep under 160 characters)"
        character_limit: 160
      image:
        type: image
        label: "Hero Image"
        comment: "Main image for the service page (1200x630px recommended)"
        options:
          width: 1200
          height: 630
          resize_style: "crop"
          mime_type: "image/webp"
          
      # === SERVICE DETAILS ===  
      category:
        type: select
        label: "Service Category"
        comment: "Primary category for this dental service"
        options:
          - Cosmetic
          - Restorative
          - Preventive
          - Family
          - Emergency
          - Orthodontic
      technology:
        type: text
        label: "Technology/Brand"
        comment: "Special technology or brand names (e.g., 'CEREC®', 'Invisalign®', 'Opalescence')"
      visit_duration:
        type: text
        label: "Treatment Duration"
        comment: "How long treatment takes (e.g., 'Single visit (90 minutes)', '2-3 visits over 4 weeks')"
      cost_range:
        type: text
        label: "Investment Range"
        comment: "Price range for the service (e.g., '$1,600 - $1,900 per tooth')"
      lumineers_cost:
        type: text
        label: "Alternative Cost"
        comment: "Alternative pricing option if applicable (e.g., Lumineers pricing)"
        
      # === TREATMENT INFORMATION ===
      conditions_treated:
        type: array
        label: "Conditions We Treat"
        comment: "List of dental conditions this service addresses"
        options:
          allow_create: true
          preview:
            text: 
              - key: value
        _inputs:
          $:
            type: text
            comment: "Add a condition this service treats"
      materials:
        type: array
        label: "Materials Used"
        comment: "Types of materials used in treatment"
        _inputs:
          $:
            type: text
            comment: "Add a material used in this treatment"
      benefits:
        type: array
        label: "Treatment Benefits"
        comment: "Key benefits patients receive from this treatment"
        _inputs:
          $:
            type: text
            comment: "Add a benefit of this treatment"
            
      # === PROCESS & WORKFLOW ===
      process_steps:
        type: array
        label: "Treatment Process"
        comment: "Step-by-step treatment workflow"
        _inputs:
          title:
            type: text
            label: "Step Title"
            comment: "Name of this treatment step"
          description:
            type: textarea
            label: "Step Description"  
            comment: "Detailed description of what happens in this step"
            
      # === MEDIA & CONTENT ===
      video_url:
        type: url
        label: "Educational Video"
        comment: "YouTube or Vimeo URL for treatment explanation video"
      before_after_gallery:
        type: array
        label: "Before & After Gallery"
        comment: "Patient case studies showing treatment results"
        _inputs:
          before:
            type: image
            label: "Before Image"
            comment: "Patient photo before treatment"
          after:
            type: image  
            label: "After Image"
            comment: "Patient photo after treatment"
          description:
            type: text
            label: "Case Description"
            comment: "Brief description of this case"
            
      # === RELATED CONTENT ===
      related_services:
        type: multiselect
        label: "Related Services"
        comment: "Other services that complement this treatment"
        options:
          values: "collections.services"
          value_key: "slug"
          preview:
            text:
              - key: "title"
      related_pages:
        type: array
        label: "Additional Information Pages"
        comment: "Links to FAQ, recovery, or information pages"
        _inputs:
          $:
            type: text
            comment: "Page slug (e.g., 'dental-crowns-faqs')"
            
      # === CALL TO ACTION ===
      cta_text:
        type: text
        label: "Special Offer Text"
        comment: "Text for special offer button (optional)"
      cta_link:
        type: url
        label: "Special Offer Link"
        comment: "URL for special offers page"
        
    # === VISUAL EDITOR GROUPS ===
    _structures:
      treatment_process:
        values:
          - label: "Consultation Step"
            icon: "person"
            value:
              title: "Initial Consultation"
              description: "Comprehensive examination and treatment planning"
          - label: "Treatment Step"
            icon: "medical_services"
            value:
              title: "Treatment Phase"
              description: "Professional treatment delivery"
          - label: "Follow-up Step"
            icon: "schedule"
            value:
              title: "Follow-up Care"
              description: "Post-treatment monitoring and care"
              
      case_study:
        values:
          - label: "Before/After Case"
            icon: "compare"
            value:
              before: "/images/gallery/before-placeholder.webp"
              after: "/images/gallery/after-placeholder.webp"
              description: "Treatment case description"
              
    # === FIELD GROUPING ===
    _groups:
      - label: "Basic Information"
        icon: "info"
        inputs:
          - title
          - description
          - image
          - category
      - label: "Treatment Details"
        icon: "medical_services"
        inputs:
          - technology
          - visit_duration
          - cost_range
          - lumineers_cost
      - label: "Clinical Information"
        icon: "list"
        inputs:
          - conditions_treated
          - materials
          - benefits
          - process_steps
      - label: "Media & Gallery"
        icon: "photo_library"
        inputs:
          - video_url
          - before_after_gallery
      - label: "Related Content"
        icon: "link"
        inputs:
          - related_services
          - related_pages
          - cta_text
          - cta_link
        
  pages:
    path: pages
    name: "Pages"
    description: "General website pages"
    icon: article
    _enabled_editors:
      - visual
      - content
      - data
      
  blog:
    path: blog
    name: "Blog"
    description: "Blog posts and articles"
    icon: edit
    _enabled_editors:
      - visual
      - content
      - data
    sort_key: date
    sort_options:
      - key: date
        order: desc
        label: "Date (newest first)"

# Global data inputs
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The main title for this page"
  description:
    type: textarea
    label: "Meta Description" 
    comment: "Description for search engines and social media"
    character_limit: 160
  image:
    type: image
    label: "Featured Image"
    comment: "Main image for this page"
  hero_title:
    type: text
    label: "Hero Title"
    comment: "Large title displayed in hero section"
  hero_subtitle:
    type: textarea
    label: "Hero Subtitle"
    comment: "Subtitle text under the main hero title"
  cta_text:
    type: text
    label: "Call-to-Action Text"
    comment: "Text for buttons and call-to-action elements"
  cta_link:
    type: url
    label: "Call-to-Action Link"
    comment: "URL for call-to-action buttons"

# Data configuration
data_config:
  navigation:
    path: src/_data/navigation.json
    _inputs:
      text:
        type: text
        label: "Menu Text"
      url:
        type: url
        label: "Link URL"
      children:
        type: array
        label: "Submenu Items"
  site_settings:
    path: src/_data/site_settings.json
    _inputs:
      practice_name:
        type: text
        label: "Practice Name"
        comment: "Full name of the dental practice"
      doctor_name:
        type: text
        label: "Doctor Name"
        comment: "Full name of the primary dentist"
      phone:
        type: text
        label: "Phone Number"
        comment: "Main practice phone number"
      email:
        type: email
        label: "Email Address"
        comment: "Main practice email"

# Editor configuration
_editors:
  content:
    bold: true
    italic: true
    link: true
    bullet_list: true
    numbered_list: true
    image: true
    table: true
    code_block: true
    snippet: true
  visual:
    preview_url: "/"
    preview_text: "Open Visual Editor"

# Build configuration  
build:
  install_command: "npm install"
  build_command: "npm run build" 
  output_dir: "_site"
  environment_variables:
    NODE_VERSION: 18

# Visual editing configuration
_structures:
  hero_buttons:
    values:
      - label: "Primary Button"
        value:
          text: "Schedule Consultation"
          url: "/contact-us/"
          style: "primary"
      - label: "Secondary Button"  
        value:
          text: "Call Now"
          url: "tel:703-746-0077"
          style: "secondary"
          
  testimonials:
    values:
      - label: "Patient Testimonial"
        value:
          content: "Quote from patient"
          author: "Patient Name"
          treatment: "Type of treatment"
          
  service_highlights:
    values:
      - label: "Service Highlight"
        value:
          title: "Highlight Title"
          description: "Brief description"
          icon: "/path/to/icon.webp"

# Timezone and locale
timezone: America/New_York
locale: en-US

# CloudCannon-specific settings
_comments:
  title: "This will appear as the page title and in search results"
  description: "Keep this under 160 characters for optimal SEO"
  image: "Choose high-quality images in WebP format when possible"
  
_options:
  image:
    width: 1200
    height: 630
    resize_style: "crop"
    mime_type: "image/webp"

# 11ty specific settings
generator:
  metadata:
    markdown: "markdown-it"
    
# Enable live editing
source_editor:
  enabled: true

# Data files for 11ty
data_config:
  navigation:
    path: "src/_data/navigation.yml"
  site:
    path: "src/_data/site.yml"
    
# Editor settings
_editors:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    code: true
    horizontalrule: true
    removeformat: true
    
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The title that appears in the browser tab and search results"
  description:
    type: textarea
    label: "Meta Description"
    comment: "Brief description for search engines (150-160 characters)"
  layout:
    type: select
    label: "Layout"
    options:
      values:
        - "layouts/base.njk"
        - "layouts/page.njk"
        - "layouts/service.njk"
        - "layouts/blog.njk"
  permalink:
    type: text
    label: "URL Path"
    comment: "The URL path for this page (e.g., /about/)"
  date:
    type: date
    label: "Date"
    comment: "Publication date"
  tags:
    type: array
    label: "Tags"
    comment: "Categories for organizing content"
        
# Asset paths
paths:
  uploads: "src/assets/images"
  
# Site settings
timezone: "America/New_York"

# CloudCannon 11ty integration
_11ty:
  enabled: true
  
# Collection schemas for better editing
_schema:
  default:
    path: "schemas/default.md"
  
# Metadata
_metadata:
  title: "Alexandria Dental Health"
  description: "Comprehensive dental care in Alexandria, VA"

# Define which files CloudCannon should ignore
ignore:
  - "node_modules"
  - ".git"
  - ".eleventy.js"
  - "package.json"
  - "package-lock.json" 