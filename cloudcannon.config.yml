# CloudCannon Configuration for 11ty
# https://cloudcannon.com/documentation/articles/setting-global-configuration/

# Build settings for 11ty
source: "src"
build:
  install_command: "npm install"
  build_command: "npm run build"
  output_directory: "_site"
  environment_variables:
    NODE_ENV: "production"

# Collections for content management - 11ty style
collections_config:
  pages:
    path: "src/pages"
    name: "Pages"
    description: "General pages like About, Contact, etc."
    output: true
    icon: "notes"
    parser: "front-matter"
    filter:
      - "*.md"
      - "*.njk"
    create:
      path: "src/pages/[slug].md"
      publish_to: "src/pages"
    
  blog:
    path: "src/blog"
    name: "Blog Posts"  
    description: "Dental health blog articles"
    output: true
    icon: "event"
    sort_key: "date"
    sort_order: "desc"
    parser: "front-matter"
    filter:
      - "*.md"
      - "*.njk"
    create:
      path: "src/blog/[slug].md"
      publish_to: "src/blog"
      schema:
        path: "schemas/blog.md"
    
  services:
    path: "src/services"
    name: "Services"
    description: "Dental service pages"
    output: true
    icon: "medical_services"
    parser: "front-matter"
    filter:
      - "*.md"
      - "*.njk"
    create:
      path: "src/services/[slug].md"
      publish_to: "src/services"

# 11ty specific settings
generator:
  metadata:
    markdown: "markdown-it"
    
# Enable live editing
source_editor:
  enabled: true

# Data files for 11ty
data_config:
  navigation:
    path: "src/_data/navigation.yml"
  site:
    path: "src/_data/site.yml"
    
# Editor settings
_editors:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    code: true
    horizontalrule: true
    removeformat: true
    
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The title that appears in the browser tab and search results"
  description:
    type: textarea
    label: "Meta Description"
    comment: "Brief description for search engines (150-160 characters)"
  layout:
    type: select
    label: "Layout"
    options:
      values:
        - "layouts/base.njk"
        - "layouts/page.njk"
        - "layouts/service.njk"
        - "layouts/blog.njk"
  permalink:
    type: text
    label: "URL Path"
    comment: "The URL path for this page (e.g., /about/)"
  date:
    type: date
    label: "Date"
    comment: "Publication date"
  tags:
    type: array
    label: "Tags"
    comment: "Categories for organizing content"
        
# Asset paths
paths:
  uploads: "src/assets/images"
  
# Site settings
timezone: "America/New_York"

# CloudCannon 11ty integration
_11ty:
  enabled: true
  
# Collection schemas for better editing
_schema:
  default:
    path: "schemas/default.md"
  
# Metadata
_metadata:
  title: "Alexandria Dental Health"
  description: "Comprehensive dental care in Alexandria, VA"

# Define which files CloudCannon should ignore
ignore:
  - "node_modules"
  - ".git"
  - ".eleventy.js"
  - "package.json"
  - "package-lock.json" 