# CloudCannon Configuration for 11ty
# Updated to work with 11ty collections properly

source: src
paths:
  uploads: /assets/uploads

# 11ty Collection Configuration - CloudCannon reads from 11ty's collection data
collections_config:
  services:
    # Let 11ty handle the collection, CloudCannon reads from built output
    output: true
    name: "Services"
    description: "Dental service pages"
    icon: medical_services
    filter: "services"
    sort_key: "title"
    _enabled_editors:
      - content
      - data
    create:
      path: "src/services/{slug}.md"
    schemas:
      default:
        path: schemas/service.md
        name: Service Page
  
  blog:
    output: true 
    name: "Blog"
    description: "Dental health blog articles"
    icon: post_add
    filter: "blog"
    sort_key: "date"
    sort_order: "desc"
    _enabled_editors:
      - content
      - data
    create:
      path: "src/blog/{slug}.md"
    schemas:
      default:
        path: schemas/blog.md
        name: Blog Post
  
  pages:
    output: true
    name: "Pages" 
    description: "General pages like About, Contact, etc."
    icon: wysiwyg
    filter: "pages"
    _enabled_editors:
      - content
      - data
    create:
      path: "src/pages/{slug}.md"
    schemas:
      default:
        path: schemas/page.md
        name: Page

# Collection groups for organization
collection_groups:
  - heading: Content
    collections:
      - services
      - pages
      - blog

# Build settings for 11ty
build:
  install_command: "npm install"
  build_command: "npm run build"
  output_directory: "_site"
  environment_variables:
    NODE_ENV: "production"

# Editor configuration
_enabled_editors:
  - content
  - data
  - visual

_editables:
  content:
    bold: true
    italics: true
    underline: true
    link: true
    bulletedlist: true
    numberedlist: true

# Schema templates for new content
_structures:
  process_steps:
    values:
      - value:
          title: ""
          description: ""
  benefits_list:
    values:
      - value: ""
  faq_items:
    values:
      - value:
          question: ""
          answer: ""

# Global configuration
base_url: /
timezone: Etc/UTC
markdown:
  engine: commonmark

source_editor:
  tab_size: 2
  show_gutter: false
  theme: pastel_on_dark

commit_templates:
  - template_string: '{message}'

# 11ty specific settings
generator:
  metadata:
    markdown: "markdown-it"
    
# Enable live editing
source_editor:
  enabled: true

# Data files for 11ty
data_config:
  navigation:
    path: "src/_data/navigation.yml"
  site:
    path: "src/_data/site.yml"
    
# Editor settings
_editors:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    code: true
    horizontalrule: true
    removeformat: true
    
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The title that appears in the browser tab and search results"
  description:
    type: textarea
    label: "Meta Description"
    comment: "Brief description for search engines (150-160 characters)"
  layout:
    type: select
    label: "Layout"
    options:
      values:
        - "layouts/base.njk"
        - "layouts/page.njk"
        - "layouts/service.njk"
        - "layouts/blog.njk"
  permalink:
    type: text
    label: "URL Path"
    comment: "The URL path for this page (e.g., /about/)"
  date:
    type: date
    label: "Date"
    comment: "Publication date"
  tags:
    type: array
    label: "Tags"
    comment: "Categories for organizing content"
        
# Asset paths
paths:
  uploads: "src/assets/images"
  
# Site settings
timezone: "America/New_York"

# CloudCannon 11ty integration
_11ty:
  enabled: true
  
# Collection schemas for better editing
_schema:
  default:
    path: "schemas/default.md"
  
# Metadata
_metadata:
  title: "Alexandria Dental Health"
  description: "Comprehensive dental care in Alexandria, VA"

# Define which files CloudCannon should ignore
ignore:
  - "node_modules"
  - ".git"
  - ".eleventy.js"
  - "package.json"
  - "package-lock.json" 