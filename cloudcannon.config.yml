# CloudCannon Configuration for 11ty
# Updated to match our actual file structure

source: src
paths:
  uploads: /assets/uploads

collections_config:
  pages:
    path: src/pages
    name: Pages
    icon: wysiwyg
    description: "General pages like About, Contact, etc."
    _enabled_editors:
      - content
      - data
  blog:
    path: src/blog
    name: Blog
    icon: post_add
    description: "Dental health blog articles"
    _enabled_editors:
      - content
      - data
  services:
    path: src/services
    name: Services
    icon: medical_services
    description: "Dental service pages"
    _enabled_editors:
      - content
      - data

collection_groups:
  - heading: Content
    collections:
      - pages
      - services
      - blog

_enabled_editors:
  - data
  - content
  - visual

_inputs:
  blog_tags:
    type: multiselect
    options:
      values: _select_data.blog_topics

_select_data:
  blog_topics:
    - Opinion
    - Feature
    - Resource

_editables:
  content:
    bold: true
    italics: true
    underline: true

# Build settings for 11ty
build:
  install_command: "npm install"
  build_command: "npm run build"
  output_directory: "_site"
  environment_variables:
    NODE_ENV: "production"

base_url: /
timezone: Etc/UTC

markdown:
  engine: commonmark

source_editor:
  tab_size: 2
  show_gutter: false
  theme: pastel_on_dark

commit_templates:
  - template_string: '{message}'

# 11ty specific settings
generator:
  metadata:
    markdown: "markdown-it"
    
# Enable live editing
source_editor:
  enabled: true

# Data files for 11ty
data_config:
  navigation:
    path: "src/_data/navigation.yml"
  site:
    path: "src/_data/site.yml"
    
# Editor settings
_editors:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    code: true
    horizontalrule: true
    removeformat: true
    
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The title that appears in the browser tab and search results"
  description:
    type: textarea
    label: "Meta Description"
    comment: "Brief description for search engines (150-160 characters)"
  layout:
    type: select
    label: "Layout"
    options:
      values:
        - "layouts/base.njk"
        - "layouts/page.njk"
        - "layouts/service.njk"
        - "layouts/blog.njk"
  permalink:
    type: text
    label: "URL Path"
    comment: "The URL path for this page (e.g., /about/)"
  date:
    type: date
    label: "Date"
    comment: "Publication date"
  tags:
    type: array
    label: "Tags"
    comment: "Categories for organizing content"
        
# Asset paths
paths:
  uploads: "src/assets/images"
  
# Site settings
timezone: "America/New_York"

# CloudCannon 11ty integration
_11ty:
  enabled: true
  
# Collection schemas for better editing
_schema:
  default:
    path: "schemas/default.md"
  
# Metadata
_metadata:
  title: "Alexandria Dental Health"
  description: "Comprehensive dental care in Alexandria, VA"

# Define which files CloudCannon should ignore
ignore:
  - "node_modules"
  - ".git"
  - ".eleventy.js"
  - "package.json"
  - "package-lock.json" 