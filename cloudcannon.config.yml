# CloudCannon Configuration for 11ty
# https://cloudcannon.com/documentation/articles/setting-global-configuration/

# Build settings for 11ty
source: "src"
build:
  install_command: "npm install"
  build_command: "npm run build"
  output_directory: "_site"
  environment_variables:
    NODE_ENV: "production"

# Collections for content management
collections_config:
  pages:
    path: "src/pages"
    name: "Pages"
    description: "General pages like About, Contact, etc."
    output: true
    icon: "notes"
    
  blog:
    path: "src/blog"
    name: "Blog Posts"  
    description: "Dental health blog articles"
    output: true
    icon: "event"
    sort_key: "date"
    sort_order: "desc"
    
  services:
    path: "src/services"
    name: "Services"
    description: "Dental service pages"
    output: true
    icon: "medical_services"

# Enable live editing
source_editor:
  enabled: true

# Data files
data_config:
  nav:
    path: "_data/navigation.yml"
  footer:
    path: "_data/footer.yml"
    
# Editor settings
_editors:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    code: true
    horizontalrule: true
    removeformat: true
    
_inputs:
  title:
    type: text
    label: "Page Title"
  description:
    type: textarea
    label: "Meta Description"
  keywords:
    type: text
    label: "Keywords"
  layout:
    type: select
    options:
      values:
        - default
        - page
        - service
        - blog-post
        
# Asset paths
paths:
  uploads: "assets/images"
  
# Site settings
timezone: "America/New_York"

# Metadata
_metadata:
  title: "Alexandria Dental Health"
  description: "Comprehensive dental care in Alexandria, VA" 