# CloudCannon Configuration - Simplified for Better UX

# Collections for Dashboard
collections_config:
  services:
    path: src/services
    name: Services
    description: Dental service pages
    icon: medical
    add_options:
      - name: Add Service
        icon: add
    # Enhanced editing configuration - Visual first
    _enabled_editors:
      - visual
      - data
      - content
        
  pages:
    path: src/pages
    name: Pages
    description: General website pages
    icon: article
    add_options:
      - name: Add Page
        icon: add
    _enabled_editors:
      - visual
      - data
      - content
        
  blog:
    path: src/blog
    name: Blog
    description: Blog posts and articles
    icon: rss_feed
    add_options:
      - name: Add Blog Post
        icon: add
    _enabled_editors:
      - visual
      - data
      - content

# Simplified inputs - organized and less overwhelming
_inputs:
  # Page Basics (always visible)
  title:
    comment: The page title
    type: text
    options:
      spellcheck: true
  subtitle:
    comment: Page subtitle or tagline
    type: textarea
    options:
      spellcheck: true
  category:
    type: select
    comment: Service category
    options:
      values:
        - Cosmetic
        - Restorative  
        - Family
        - General
  
  # Hero Section
  heroImage:
    type: image
    comment: Main hero/banner image
    options:
      width: 1200
      height: 600
      resize_style: "fit"
  heroImageAlt:
    comment: Image description for accessibility
    type: text
  ctaText:
    comment: Call-to-action button text
    type: text
    options:
      placeholder: "e.g., Schedule Consultation"
  
  # Content Arrays (simplified)
  benefits:
    type: array
    comment: Treatment benefits - click + to add more
    options:
      structures:
        values:
          - label: Benefit
            value: ""
  
  process_steps:
    type: array
    comment: Treatment process steps
    options:
      structures:
        values:
          - label: Process Step
            value:
              title: ""
              description: ""
  
  faq:
    type: array
    comment: Frequently asked questions
    options:
      structures:
        values:
          - label: FAQ Item
            value:
              question: ""
              answer: ""
  
  investment:
    type: object
    comment: Pricing information
    options:
      structures:
        values:
          - label: Investment Details
            value:
              primary: ""
              financing: ""
              note: ""
  
  related_services:
    type: array
    comment: Related services (2-3 recommended)
    options:
      structures:
        values:
          - label: Related Service
            value:
              title: ""
              url: ""
  
  # SEO (collapsed by default)
  description:
    comment: SEO description (appears in search results)
    type: textarea
    options:
      spellcheck: true
  keywords:
    comment: SEO keywords (comma separated)
    type: text
  tags:
    type: array
    comment: Page tags
    options:
      allow_create: true

# Hide technical fields from sidebar
_inputs_excluded:
  - editable_regions
  - social_image
  - og_description
  - show_hero
  - show_sidebar
  - show_cta
  - content_sections
  - in_nav
  - nav_order
  - page_type
  - cloudcannon_optimized
  - visual_editing_enabled
  - template_version
  - eleventy
  - build_optimization
  - galleryImages
  - beforeImage
  - afterImage
  - author
  - date
  - ctaLink
  - layout
  - permalink

# Visual editor configuration (simplified)
_editables:
  content:
    bold: true
    italic: true
    link: true
    bullet_list: true
    numbered_list: true
    heading: true
    image: true
    removeformat: true
  text:
    bold: true
    italic: true
    removeformat: true

# Build and generator configuration
generator:
  metadata:
    eleventy: true
    markdown: "markdown-it"
    markdown-it:
      html: true
      linkify: true

# Build settings
build:
  install_command: "npm install"
  build_command: "npm run build"
  output_dir: "_site"
  environment_variables:
    NODE_VERSION: 18
    ELEVENTY_ENV: "production"

# CloudCannon editing configuration (simplified comments)
_comments:
  title: 'The main page title (H1)'
  subtitle: 'Brief description under the title'
  category: 'Choose the service category'
  heroImage: 'Main banner image for the page'
  benefits: 'Click + to add treatment benefits'
  process_steps: 'Click + to add process steps'
  faq: 'Click + to add FAQ items'
  investment: 'Edit pricing information'
  related_services: 'Add 2-3 related service links'
  description: 'SEO description for search engines'

# Visual editor as default
editor:
  default_path: "/src/"
  
# Default to visual editor for all collections
_defaults:
  _editor: visual 