# CloudCannon Configuration
source: src
collections_config:
  services:
    path: services
    name: "Services"
    description: "Dental service pages with visual editing"
    icon: medical
    _enabled_editors:
      - visual
      - content
      - data
    add_options:
      - name: "New Service Page"
        icon: add
        href: "cloudcannon:explore/services/"
    schemas:
      default:
        path: schemas/service.md
    _inputs:
      title:
        type: text
        label: "Service Title"
        comment: "The main title for this service page"
      description:
        type: textarea
        label: "Meta Description"
        comment: "SEO description for search engines"
      image:
        type: image
        label: "Hero Image"
        comment: "Main image for the service page"
      category:
        type: select
        options:
          - Cosmetic
          - Restorative
          - Preventive
          - Family
          - Emergency
      technology:
        type: text
        label: "Technology Used"
        comment: "e.g., CEREC®, Invisalign®"
      visit_duration:
        type: text
        label: "Visit Duration"
        comment: "e.g., Single visit (90 minutes)"
      conditions_treated:
        type: array
        label: "Conditions Treated"
        comment: "List of dental conditions this service addresses"
      materials:
        type: array
        label: "Materials Used"
        comment: "Types of materials used in treatment"
      related_services:
        type: array
        label: "Related Services"
        comment: "Links to related service pages"
        
  pages:
    path: pages
    name: "Pages"
    description: "General website pages"
    icon: article
    _enabled_editors:
      - visual
      - content
      - data
      
  blog:
    path: blog
    name: "Blog"
    description: "Blog posts and articles"
    icon: edit
    _enabled_editors:
      - visual
      - content
      - data
    sort_key: date
    sort_options:
      - key: date
        order: desc
        label: "Date (newest first)"

# Global data inputs
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The main title for this page"
  description:
    type: textarea
    label: "Meta Description" 
    comment: "Description for search engines and social media"
  image:
    type: image
    label: "Featured Image"
    comment: "Main image for this page"
  hero_title:
    type: text
    label: "Hero Title"
    comment: "Large title displayed in hero section"
  hero_subtitle:
    type: textarea
    label: "Hero Subtitle"
    comment: "Subtitle text under the main hero title"
  cta_text:
    type: text
    label: "Call-to-Action Text"
    comment: "Text for buttons and call-to-action elements"
  cta_link:
    type: url
    label: "Call-to-Action Link"
    comment: "URL for call-to-action buttons"

# Data configuration
data_config:
  navigation:
    path: src/_data/navigation.json
    _inputs:
      text:
        type: text
        label: "Menu Text"
      url:
        type: url
        label: "Link URL"
      children:
        type: array
        label: "Submenu Items"

# Editor configuration
_editors:
  content:
    bold: true
    italic: true
    link: true
    bullet_list: true
    numbered_list: true
    image: true
    table: true
    code_block: true
    snippet: true
  visual:
    preview_url: "/"
    preview_text: "Open Visual Editor"

# Build configuration  
build:
  install_command: "npm install"
  build_command: "npm run build" 
  output_dir: "_site"
  environment_variables:
    NODE_VERSION: 18

# Visual editing configuration
_structures:
  hero_buttons:
    values:
      - label: "Primary Button"
        value:
          text: "Schedule Consultation"
          url: "/contact-us/"
          style: "primary"
      - label: "Secondary Button"  
        value:
          text: "Call Now"
          url: "tel:703-746-0077"
          style: "secondary"
          
  testimonials:
    values:
      - label: "Patient Testimonial"
        value:
          content: "Quote from patient"
          author: "Patient Name"
          treatment: "Type of treatment"
          
  service_highlights:
    values:
      - label: "Service Highlight"
        value:
          title: "Highlight Title"
          description: "Brief description"
          icon: "/path/to/icon.webp"

# Timezone and locale
timezone: America/New_York
locale: en-US

# CloudCannon-specific settings
_comments:
  title: "This will appear as the page title and in search results"
  description: "Keep this under 160 characters for optimal SEO"
  image: "Choose high-quality images in WebP format when possible"
  
_options:
  image:
    width: 1200
    height: 630
    resize_style: "crop"
    mime_type: "image/webp"

# 11ty specific settings
generator:
  metadata:
    markdown: "markdown-it"
    
# Enable live editing
source_editor:
  enabled: true

# Data files for 11ty
data_config:
  navigation:
    path: "src/_data/navigation.yml"
  site:
    path: "src/_data/site.yml"
    
# Editor settings
_editors:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    code: true
    horizontalrule: true
    removeformat: true
    
_inputs:
  title:
    type: text
    label: "Page Title"
    comment: "The title that appears in the browser tab and search results"
  description:
    type: textarea
    label: "Meta Description"
    comment: "Brief description for search engines (150-160 characters)"
  layout:
    type: select
    label: "Layout"
    options:
      values:
        - "layouts/base.njk"
        - "layouts/page.njk"
        - "layouts/service.njk"
        - "layouts/blog.njk"
  permalink:
    type: text
    label: "URL Path"
    comment: "The URL path for this page (e.g., /about/)"
  date:
    type: date
    label: "Date"
    comment: "Publication date"
  tags:
    type: array
    label: "Tags"
    comment: "Categories for organizing content"
        
# Asset paths
paths:
  uploads: "src/assets/images"
  
# Site settings
timezone: "America/New_York"

# CloudCannon 11ty integration
_11ty:
  enabled: true
  
# Collection schemas for better editing
_schema:
  default:
    path: "schemas/default.md"
  
# Metadata
_metadata:
  title: "Alexandria Dental Health"
  description: "Comprehensive dental care in Alexandria, VA"

# Define which files CloudCannon should ignore
ignore:
  - "node_modules"
  - ".git"
  - ".eleventy.js"
  - "package.json"
  - "package-lock.json" 